<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spanish Vocabulary Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- Header Section -->
    <header class="bg-indigo-600 text-white shadow-md py-6 px-4">
        <div class="max-w-4xl mx-auto text-center relative flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="text-center sm:text-left">
                <h1 class="text-2xl md:text-3xl font-bold">Spanish Vocabulary Flashcards</h1>
                <p class="text-indigo-200 text-sm mt-1">Interactive Learning Set • Verbs, Adjectives & Professions</p>
            </div>
            <button onclick="saveFile()" class="bg-indigo-700 hover:bg-indigo-800 text-white text-xs sm:text-sm font-semibold py-2 px-3 sm:px-4 rounded-xl shadow-sm transition active:scale-95 flex items-center gap-1.5 shrink-0">
                💾 Save As...
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-2xl mx-auto w-full">

        <!-- Category Filters / Tabs -->
        <div class="w-full flex flex-wrap justify-center gap-2 mb-6">
            <button onclick="filterCategory('all')" id="tab-all" class="category-btn bg-indigo-600 text-white font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
                All Cards (<span id="count-all">0</span>)
            </button>
            <button onclick="filterCategory('Verbos')" id="tab-Verbos" class="category-btn bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
                Verbs (<span id="count-Verbos">0</span>)
            </button>
            <button onclick="filterCategory('Adjetivos')" id="tab-Adjetivos" class="category-btn bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
                Adjectives (<span id="count-Adjetivos">0</span>)
            </button>
            <button onclick="filterCategory('Profesiones')" id="tab-Profesiones" class="category-btn bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
                Professions (<span id="count-Profesiones">0</span>)
            </button>
        </div>

        <!-- Progress Bar & Counter -->
        <div class="w-full flex justify-between items-center mb-3 text-sm font-medium text-slate-500">
            <span id="card-counter">Card 1 of 10</span>
            <div class="w-1/2 bg-slate-200 h-2 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-indigo-600 h-full transition-all duration-300" style="width: 10%;"></div>
            </div>
        </div>

        <!-- Flashcard Wrapper -->
        <div class="w-full h-80 sm:h-96 perspective-1000 cursor-pointer group" onclick="flipCard()">
            <div id="flashcard-inner" class="relative w-full h-full duration-500 transform-style-3d shadow-xl rounded-2xl bg-white border border-slate-100" style="transform: rotateY(0deg);">

                <!-- Front of Card (Spanish) -->
                <div class="absolute inset-0 w-full h-full backface-hidden flex flex-col items-center justify-between p-6 text-center bg-white rounded-2xl border-2 border-indigo-50">
                    <div class="w-full flex justify-between items-center">
                        <span id="card-category-badge" class="text-xs uppercase tracking-wider font-semibold px-3 py-1 rounded-full bg-indigo-100 text-indigo-700">Verbos</span>
                        <button onclick="speakText(event)" class="p-2 rounded-full hover:bg-indigo-50 text-indigo-600 transition" title="Listen Pronunciation">
                            🔊
                        </button>
                    </div>

                    <div class="my-auto">
                        <h2 id="card-front" class="text-3xl sm:text-5xl font-bold text-slate-800 tracking-tight">actuar</h2>
                        <p id="card-subtext" class="text-sm text-slate-400 mt-2 italic"></p>
                    </div>

                    <p class="text-xs text-slate-400 font-medium">(Click or tap card to flip)</p>
                </div>

                <!-- Back of Card (English) -->
                <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 flex flex-col items-center justify-between p-6 text-center bg-indigo-50 rounded-2xl border-2 border-indigo-200">
                    <div class="w-full flex justify-between items-center">
                        <span class="text-xs uppercase tracking-wider font-semibold px-3 py-1 rounded-full bg-indigo-200 text-indigo-900">Translation</span>
                        <span id="card-category-back" class="text-xs text-indigo-500 font-medium italic"></span>
                    </div>

                    <div class="my-auto">
                        <h2 id="card-back" class="text-2xl sm:text-4xl font-bold text-indigo-900">to act</h2>
                    </div>

                    <p id="card-hint" class="text-xs text-indigo-600 font-medium italic">Card 1 of 10</p>
                </div>

            </div>
        </div>

        <!-- Navigation Controls -->
        <div class="flex items-center justify-between w-full mt-6 gap-3 sm:gap-4">
            <button onclick="prevCard()" class="flex-1 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition active:scale-95 flex items-center justify-center gap-1">
                ← Previous
            </button>
            <button onclick="shuffleCards()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm transition active:scale-95" title="Shuffle cards">
                🔀 Shuffle
            </button>
            <button onclick="nextCard()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition active:scale-95 flex items-center justify-center gap-1">
                Next →
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-6 bg-white">
        <p>Spanish Visual Vocabulary Flashcards • Interactive Learning Application</p>
    </footer>

    <script>
        // Data derived directly from provided images
        const rawFlashcards = [
            // --- Verbos (1000007273.jpg) ---
            { front: "actuar", back: "to act", category: "Verbos" },
            { front: "amar", back: "to love", category: "Verbos" },
            { front: "apagar", back: "to turn off", category: "Verbos" },
            { front: "ayudar", back: "to help", category: "Verbos" },
            { front: "bailar", back: "to dance", category: "Verbos" },
            { front: "buscar", back: "to look for", category: "Verbos" },
            { front: "caminar", back: "to walk", category: "Verbos" },
            { front: "cantar", back: "to sing", category: "Verbos" },
            { front: "cenar", back: "to have dinner", category: "Verbos" },
            { front: "cobrar", back: "to charge", category: "Verbos" },
            { front: "cocinar", back: "to cook", category: "Verbos" },
            { front: "comprar", back: "to buy", category: "Verbos" },
            { front: "crear", back: "to create", category: "Verbos" },
            { front: "cuidar", back: "to take care", category: "Verbos" },
            { front: "diseñar", back: "to design", category: "Verbos" },
            { front: "enseñar", back: "to teach", category: "Verbos" },
            { front: "entrar", back: "to enter", category: "Verbos" },
            { front: "escuchar", back: "to listen to", category: "Verbos" },
            { front: "esperar", back: "to wait", category: "Verbos" },
            { front: "estudiar", back: "to study", category: "Verbos" },
            { front: "ganar", back: "to win", category: "Verbos" },

            // --- Adjetivos Opuestos (1000007271.jpg & 1000007272.jpg) ---
            { front: "largo/a ↔ corto/a", back: "long ↔ short", category: "Adjetivos", subtext: "Opuestos" },
            { front: "educado/a ↔ maleducado/a", back: "polite, well-mannered ↔ rude, ill-mannered", category: "Adjetivos", subtext: "Opuestos" },
            { front: "gordo/a ↔ delgado/a", back: "heavyset, fat ↔ thin, slim", category: "Adjetivos", subtext: "Opuestos" },
            { front: "caliente ↔ frío/a", back: "hot ↔ cold", category: "Adjetivos", subtext: "Opuestos" },
            { front: "antiguo/a ↔ moderno/a", back: "old, antique ↔ modern", category: "Adjetivos", subtext: "Opuestos" },
            { front: "ancho/a ↔ estrecho/a", back: "wide ↔ narrow", category: "Adjetivos", subtext: "Opuestos" },
            { front: "agradable ↔ desagradable", back: "pleasant, agreeable ↔ unpleasant, disagreeable", category: "Adjetivos", subtext: "Opuestos" },
            { front: "fuerte ↔ débil", back: "strong ↔ weak", category: "Adjetivos", subtext: "Opuestos" },
            { front: "famoso/a ↔ desconocido/a", back: "famous ↔ unknown", category: "Adjetivos", subtext: "Opuestos" },
            { front: "feliz ↔ triste", back: "happy ↔ sad", category: "Adjetivos", subtext: "Opuestos" },
            { front: "divertido/a ↔ aburrido/a", back: "fun, entertaining ↔ boring", category: "Adjetivos", subtext: "Opuestos" },
            { front: "duro/a ↔ blando/a", back: "hard ↔ soft", category: "Adjetivos", subtext: "Opuestos" },
            { front: "egoísta ↔ solidario/a", back: "selfish ↔ supportive, caring", category: "Adjetivos", subtext: "Opuestos" },
            { front: "fácil ↔ difícil", back: "easy ↔ difficult", category: "Adjetivos", subtext: "Opuestos" },
            { front: "cuadrado/a ↔ redondo/a", back: "square ↔ round", category: "Adjetivos", subtext: "Opuestos" },
            { front: "conocido/a ↔ desconocido/a", back: "known, well-known ↔ unknown", category: "Adjetivos", subtext: "Opuestos" },
            { front: "cómodo/a ↔ incómodo/a", back: "comfortable ↔ uncomfortable", category: "Adjetivos", subtext: "Opuestos" },
            { front: "colorido/a ↔ descolorido/a", back: "colorful ↔ faded, colorless", category: "Adjetivos", subtext: "Opuestos" },
            { front: "casado/a ↔ soltero/a", back: "married ↔ single", category: "Adjetivos", subtext: "Opuestos" },
            { front: "caro/a ↔ barato/a", back: "expensive ↔ cheap, inexpensive", category: "Adjetivos", subtext: "Opuestos" },

            // --- Las Profesiones (1000007270.jpg) ---
            { front: "abogado - abogada", back: "lawyer", category: "Profesiones" },
            { front: "actor - actriz", back: "actor / actress", category: "Profesiones" },
            { front: "arquitecto - arquitecta", back: "architect", category: "Profesiones" },
            { front: "astronauta", back: "astronaut", category: "Profesiones" },
            { front: "bombero - mebombera", back: "fireman / firewoman", category: "Profesiones" },
            { front: "cajero - cajera", back: "cashier", category: "Profesiones" },
            { front: "mesero - mesera", back: "waiter / waitress", category: "Profesiones" },
            { front: "dentista", back: "dentist", category: "Profesiones" },
            { front: "electricista", back: "electrician", category: "Profesiones" },
            { front: "empresario - empresaria", back: "business person", category: "Profesiones" },
            { front: "doctor - doctora", back: "doctor", category: "Profesiones" },
            { front: "plomero - plomera", back: "plumber", category: "Profesiones" },
            { front: "fotógrafo - fotógrafa", back: "photographer", category: "Profesiones" },
            { front: "ingeniero - ingeniera", back: "engineer", category: "Profesiones" },
            { front: "juez - jueza", back: "judge", category: "Profesiones" },
            { front: "profesor - profesora", back: "teacher", category: "Profesiones" },
            { front: "mecánico - mecánica", back: "mechanic", category: "Profesiones" },
            { front: "panadero - panadera", back: "baker", category: "Profesiones" },
            { front: "periodista", back: "journalist", category: "Profesiones" },
            { front: "policía", back: "police officer", category: "Profesiones" }
        ];

        let currentCategory = 'all';
        let filteredCards = [...rawFlashcards];
        let currentIndex = 0;
        let isFlipped = false;

        const cardInner = document.getElementById('flashcard-inner');
        const cardFront = document.getElementById('card-front');
        const cardSubtext = document.getElementById('card-subtext');
        const cardBack = document.getElementById('card-back');
        const cardHint = document.getElementById('card-hint');
        const cardCategoryBadge = document.getElementById('card-category-badge');
        const cardCategoryBack = document.getElementById('card-category-back');
        const cardCounter = document.getElementById('card-counter');
        const progressBar = document.getElementById('progress-bar');

        // Initialize counts
        function updateCounts() {
            document.getElementById('count-all').textContent = rawFlashcards.length;
            document.getElementById('count-Verbos').textContent = rawFlashcards.filter(c => c.category === 'Verbos').length;
            document.getElementById('count-Adjetivos').textContent = rawFlashcards.filter(c => c.category === 'Adjetivos').length;
            document.getElementById('count-Profesiones').textContent = rawFlashcards.filter(c => c.category === 'Profesiones').length;
        }

        function filterCategory(category) {
            currentCategory = category;
            
            // Highlight buttons
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.className = "category-btn bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95";
            });
            const activeBtn = document.getElementById(`tab-${category}`);
            if (activeBtn) {
                activeBtn.className = "category-btn bg-indigo-600 text-white font-semibold py-2 px-4 rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95";
            }

            if (category === 'all') {
                filteredCards = [...rawFlashcards];
            } else {
                filteredCards = rawFlashcards.filter(card => card.category === category);
            }

            currentIndex = 0;
            updateCard();
        }

        function updateCard() {
            isFlipped = false;
            cardInner.style.transform = 'rotateY(0deg)';
            
            setTimeout(() => {
                if (filteredCards.length === 0) return;
                const card = filteredCards[currentIndex];
                cardFront.textContent = card.front;
                cardSubtext.textContent = card.subtext || '';
                cardBack.textContent = card.back;
                cardCategoryBadge.textContent = card.category;
                cardCategoryBack.textContent = card.category;
                cardHint.textContent = `Card ${currentIndex + 1} of ${filteredCards.length}`;
                cardCounter.textContent = `Card ${currentIndex + 1} of ${filteredCards.length}`;
                progressBar.style.width = `${((currentIndex + 1) / filteredCards.length) * 100}%`;
            }, 150);
        }

        function flipCard() {
            isFlipped = !isFlipped;
            cardInner.style.transform = isFlipped ? 'rotateY(180deg)' : 'rotateY(0deg)';
        }

        function nextCard() {
            if (filteredCards.length === 0) return;
            currentIndex = (currentIndex + 1) % filteredCards.length;
            updateCard();
        }

        function prevCard() {
            if (filteredCards.length === 0) return;
            currentIndex = (currentIndex - 1 + filteredCards.length) % filteredCards.length;
            updateCard();
        }

        function shuffleCards() {
            for (let i = filteredCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filteredCards[i], filteredCards[j]] = [filteredCards[j], filteredCards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        function speakText(event) {
            event.stopPropagation(); // Don't flip card on speak click
            if ('speechSynthesis' in window) {
                const text = filteredCards[currentIndex].front.replace('↔', ' o ');
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                window.speechSynthesis.speak(utterance);
            }
        }

        async function saveFile() {
            const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            
            if (window.showSaveFilePicker) {
                try {
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'spanish_flashcards.html',
                        types: [{
                            description: 'HTML Files',
                            accept: { 'text/html': ['.html'] },
                        }],
                    });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    return;
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Error saving file:', err);
                    } else {
                        return;
                    }
                }
            }
            
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'spanish_flashcards.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Key Listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextCard();
            if (e.key === 'ArrowLeft') prevCard();
            if (e.key === ' ' || e.key === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // Init
        updateCounts();
        updateCard();
    </script>
</body>
</html>
